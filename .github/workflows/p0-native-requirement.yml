name: P0 resume authentic native requirement task
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful official native kickoff Actions run ID'
        type: string
        default: '39150138291'
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-native-requirement.yml'
permissions:
  contents: read
  actions: read
jobs:
  requirement-confirmation-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - name: Restore exact existing native task from prior Actions evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-real-native-unreviewed-task
          path: .
          run-id: ${{ github.event.inputs.source_run_id || '39150138291' }}
          github-token: ${{ github.token }}
      - name: Clone pinned Gitee native Skill (read-only original)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git -c http.lowSpeedLimit=300 -c http.lowSpeedTime=60 clone --depth 1 --single-branch --branch main https://gitee.com/szlwin/common-develop.git upstream; then break; fi
            rm -rf upstream
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          expected=b26715f6779b373b4f840b519ba9725fed5d789a
          if [[ "$(git -C upstream rev-parse HEAD)" != "$expected" ]]; then
            echo "Gitee main moved; fetching the exact audited commit, not updating the pin."
            if ! git -C upstream fetch --depth=1 origin "$expected"; then
              git -C upstream fetch --deepen=250 origin main
            fi
            git -C upstream cat-file -e "$expected^{commit}" || { echo "Pinned Gitee SHA unavailable"; exit 2; }
            git -C upstream checkout --detach "$expected"
          fi
          test "$(git -C upstream rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install 'jsonschema==4.23.0' 'PyYAML==6.0.2'
      - name: Validate original task and query real RequirementConfirmationAgent context
        shell: bash
        run: |
          set -euo pipefail
          task=native-doc/version/V_P0/task/FEATURE-DESC-DAE4FAB5F9F4
          skill=upstream/skills/common-develop-opt
          test -f "$task/task_events.jsonl"
          mkdir -p native-requirement-evidence
          python "$skill/scripts/long_task.py" validate -g ProjectManagerAgent --task-dir "$task" --json | tee native-requirement-evidence/native-validate.json
          python "$skill/scripts/long_task.py" --help > native-requirement-evidence/native-command-list.txt
          python "$skill/scripts/long_task.py" help --command task-context --json > native-requirement-evidence/task-context-contract.json
          python "$skill/scripts/long_task.py" help --command start-attempt --json > native-requirement-evidence/start-attempt-contract.json
          python "$skill/scripts/wk.py" context -g ProjectManagerAgent --task-dir "$task" --json > native-requirement-evidence/native-wk-context.json
          echo '=== PLAN COMMAND DISCOVERY ==='
          grep -R -n -m 3 -E "def command_(add|plan|create)_task|add-task|plan-task|register-task|task-plan" "$skill/scripts/runtime/_long_task" "$skill/scripts/wk.py" | head -65 || true
          echo '=== LIST NATIVE ALLOWED COMMANDS ==='
          sed -n '1,105p' native-requirement-evidence/native-command-list.txt
          echo '=== OFFICIAL TASK PLANNING TOOLS ==='
          find "$skill/scripts" -maxdepth 2 -type f \( -iname '*task*' -o -iname '*plan*' \) | head -55
          grep -R -n -m 1 -E 'task-plan|add-task|create-task|PLAN_TASK' "$skill/scripts/wk.py" "$skill/scripts/document_core/task_plan.py" "$skill/scripts/runtime/_long_task/commands" | head -75 || true
          echo '=== wk command list ==='
          python "$skill/scripts/wk.py" --help | head -95
          echo '=== task-plan script HELP when present ==='
          test ! -f "$skill/scripts/task_plan.py" || python "$skill/scripts/task_plan.py" --help | head -90
          python "$skill/scripts/long_task.py" task-events -g ProjectManagerAgent --task-dir "$task" --include-archive --json > native-requirement-evidence/native-events.json
      - name: Check no StageOutcome approval was fabricated
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('native-requirement-evidence')
          j=json.loads((out/'native-wk-context.json').read_text())
          events=json.loads((out/'native-events.json').read_text())
          v=json.loads((out/'native-validate.json').read_text())
          print('Native status:',v.get('status'))
          print('Native context:', json.dumps(j,ensure_ascii=False)[:5500])
          assert v['status']=='PASSED'
          assert not any(e.get('type')=='STAGE_OUTCOME_FINALIZED' for e in events['events'])
          status={'schema':'p0/real-requirement-context/v1',
                  'nativeValidatorPassed':True,
                  'approvalVerified':False,
                  'taskId':'FEATURE-DESC-DAE4FAB5F9F4',
                  'currentContext':j,
                  'stageTaskPlanPresent':bool(j.get('context',{}).get('stableIdIndex',{}).get('taskIds',[])),
                  'nextRequiredStep':'A real RequirementConfirmationAgent must execute the actual task, then independent native Review'}
          (out/'requirement-handoff.json').write_text(json.dumps(status,indent=2,ensure_ascii=False))
          PY
      - name: Preserve task + native context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-real-native-requirement-context
          path: |
            native-doc/
            native-requirement-evidence/
          if-no-files-found: warn
      - name: Preserve exact pinned original Gitee Skill for local native continuation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p0-exact-gitee-common-develop-opt-source
          path: upstream/skills/common-develop-opt/
          include-hidden-files: true
          if-no-files-found: error
