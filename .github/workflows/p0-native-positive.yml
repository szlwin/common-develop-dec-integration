name: P0 native approved design handoff (explicit only)
on:
  workflow_dispatch:
    inputs:
      gate_path:
        description: "Sanitized native handoff Gate JSON path inside this repo"
        required: true
        type: string
      task_dir:
        description: "Sanitized common-develop-opt project task directory inside this repo"
        required: true
        type: string
permissions:
  contents: read
jobs:
  approved-gate-to-dec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: demo-test2
          MYSQL_ROOT_PASSWORD: demo-ci-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdemo-ci-only" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DEC_DB_URL: jdbc:mysql://127.0.0.1:3306/demo-test2
      DEC_DB_USERNAME: root
      DEC_DB_PASSWORD: demo-ci-only
      DEC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/demo-test2
      DEC_MYSQL_USER: root
      DEC_MYSQL_PASSWORD: demo-ci-only
      NATIVE_TASK_DIR: ${{ inputs.task_dir }}
      NATIVE_GATE_PATH: ${{ inputs.gate_path }}
    steps:
      - name: Checkout integration plus sanitized approved task
        uses: actions/checkout@v4
        with:
          path: integration
      - name: Checkout exact DEC Demo revision
        uses: actions/checkout@v4
        with:
          repository: szlwin/doc-eq-code-Dgremlin-skills
          ref: 4fb21242498746365c201fdf2a7fd8052f3a122a
          path: dec
      - name: Clone exact Gitee common-develop-opt
        shell: bash
        run: |
          set -euo pipefail
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=15 clone --depth 1 --single-branch --branch main https://gitee.com/szlwin/common-develop.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "b26715f6779b373b4f840b519ba9725fed5d789a"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install DEC Python dependencies
        run: python -m pip install -r integration/requirements-ci.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: dec/dec-java-lite/pom.xml
      - name: Validate native evidence paths are inside repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path("integration").resolve(strict=True)
          for envvar in ("NATIVE_TASK_DIR", "NATIVE_GATE_PATH"):
              rel = Path(os.environ[envvar])
              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit("Unsafe path: " + envvar)
              f = (root / rel).resolve(strict=True)
              if root not in f.parents:
                  raise SystemExit("Path escapes repository: " + envvar)
          PY
      - name: Run actual native-positive fixed-provider integration
        shell: bash
        run: |
          chmod +x dec/dec-java-lite/mvnw
          python integration/scripts/p0_integration.py \
            --dec-root dec \
            --output p0-native-output \
            --gate "integration/$NATIVE_GATE_PATH" \
            --native-opt-root upstream/skills/common-develop-opt \
            --native-task-dir "integration/$NATIVE_TASK_DIR"
      - name: Verify native handoff evidence and exact release boundary
        run: python integration/scripts/check_native_positive_evidence.py --output p0-native-output
      - name: Upload positive native Gate and DEC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-real-native-positive-evidence
          path: |
            p0-native-output/
            dec/demo/order-payment-app/target/dec-binding-evidence.json
            dec/demo/order-payment-app/target/surefire-reports/
          if-no-files-found: warn
