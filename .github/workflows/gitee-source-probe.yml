name: P0 real common-develop-opt native negative Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-unapproved-task-must-block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration adapter
        uses: actions/checkout@v4
        with:
          path: integration
      - name: Get original common-develop-opt from Gitee
        shell: bash
        run: |
          set -euo pipefail
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=15 clone --depth 1 --single-branch --branch main https://gitee.com/szlwin/common-develop.git upstream
          expected=b26715f6779b373b4f840b519ba9725fed5d789a
          actual="$(git -C upstream rev-parse HEAD)"
          echo "Gitee source commit: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "Gitee baseline changed; review native CLI contract before updating the pinned commit"
            exit 2
          fi
          test -f upstream/skills/common-develop-opt/SKILL.md
      - name: Native Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify native CLI runs and blocks unapproved design
        run: python integration/scripts/native_negative_check.py --opt-root upstream/skills/common-develop-opt
      - name: Audit native revision/phase contract (read only)
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/skills/common-develop-opt
          echo '=== PUBLISH PHASE ==='
          sed -n '1,180p' scripts/runtime/_long_task/commands/artifacts.py
          echo '=== FINALIZE PHASE ==='
          sed -n '559,640p' scripts/runtime/_long_task/commands/phases.py
          echo '=== REVISION VALIDATION ==='
          grep -R -n -E 'revision.*(re.match|fullmatch|startswith|pattern)|REVISION_PATTERN|output_revision.*(pattern|format)|def .*revision' scripts/runtime/_long_task/ scripts/review_contract.py | head -80 || :
          echo '=== HELPS ==='
          python scripts/long_task.py publish-artifact -h | tail -35
          python scripts/long_task.py start-attempt -h | tail -35
          python scripts/long_task.py finish-attempt -h | tail -35
