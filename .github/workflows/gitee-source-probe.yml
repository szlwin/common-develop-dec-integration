name: P0 real common-develop-opt native negative Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-unapproved-task-must-block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration adapter
        uses: actions/checkout@v4
        with:
          path: integration
      - name: Get original common-develop-opt from Gitee
        shell: bash
        run: |
          set -euo pipefail
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=15 clone --depth 1 --single-branch --branch main https://gitee.com/szlwin/common-develop.git upstream
          expected=b26715f6779b373b4f840b519ba9725fed5d789a
          actual="$(git -C upstream rev-parse HEAD)"
          echo "Gitee source commit: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "Gitee baseline changed; review native CLI contract before updating the pinned commit"
            exit 2
          fi
          test -f upstream/skills/common-develop-opt/SKILL.md
      - name: Native Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify native CLI runs and blocks unapproved design
        run: python integration/scripts/native_negative_check.py --opt-root upstream/skills/common-develop-opt
      - name: Audit native positive contract without creating approvals
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/skills/common-develop-opt
          echo '=== PHASES ==='
          grep -R -n -m 2 'PHASES =\|PHASES=' scripts/runtime/_long_task | head -25 || true
          echo '=== REVISION PATTERNS ==='
          grep -R -n -m 2 -E 'output_revision.*(pattern|match|regex)|REVISION_PATTERN|outputRevision.*pattern|sha256:' scripts/runtime/_long_task assets/runtime | head -80 || true
          echo '=== NATIVE SCHEMAS ==='
          grep -R -l -E '"output_revision"|"event_id"|"input_revisions"' assets/runtime/* scripts/runtime/_long_task/* 2>/dev/null | head -45 || true
          echo '=== ARTIFACT REVIEW COMMANDS ==='
          python scripts/long_task.py help --command start-attempt --json | head -65
          python scripts/long_task.py help --command finish-attempt --json | head -65
          python scripts/long_task.py help --command publish-artifact --json | head -65
          python scripts/long_task.py help --command finalize-phase --json | head -50
          echo '=== PHASE NAMES AND REVISION CONTRACT ==='
          sed -n '1,62p' scripts/runtime/_long_task/contracts.py
          sed -n '170,217p' scripts/runtime/_long_task/validation/task_completion.py
          grep -R -n -m 2 'output_revision' assets/runtime/*json | head -25 || true
          echo '=== Wk starts real task ==='
          python scripts/wk.py help --script wk --command start --json | python -c "import json,sys; j=json.load(sys.stdin); print(j.get('usage')); print([(a['name'],a.get('required')) for a in j.get('arguments',[])])"
          python scripts/wk.py help --script wk --command begin --json | python -c "import json,sys; j=json.load(sys.stdin); print(j.get('usage')); print([(a['name'],a.get('required')) for a in j.get('arguments',[])])"
          echo '=== Full native canonical stages ==='
          python -c "import json; j=json.load(open('assets/runtime/runtime-contract.json')); print([x['id'] for x in j['canonicalPhases'] if x.get('phaseKind','CANONICAL')=='CANONICAL'])"
